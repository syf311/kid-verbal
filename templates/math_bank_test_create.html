{% extends "base.html" %}

{% block title %}Create Math Bank Test - {{ child.name }}{% endblock %}

{% block extra_css %}
<style>
    .filter-bar { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
    .filter-btn {
        padding: 4px 10px; font-size: 12px; border-radius: 12px; border: 1px solid #cbd5e0;
        background: #fff; cursor: pointer; font-weight: 600; transition: all 0.15s;
    }
    .filter-btn:hover { border-color: #667eea; }
    .filter-btn.active { background: #667eea; color: #fff; border-color: #667eea; }
    .q-item {
        display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px;
        border: 2px solid transparent; border-left: 4px solid #667eea;
        border-radius: 10px; margin-bottom: 8px; cursor: pointer;
        background: #f7fafc; transition: all 0.15s;
    }
    .q-item:hover { background: #edf2f7; }
    .q-item.selected { background: #ebf4ff; border-color: #667eea; }
    .q-item input[type="checkbox"] { margin-top: 3px; width: 16px; height: 16px; }
    .concept-tag {
        display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px;
        font-weight: 600; background: #e9d8fd; color: #553c9a;
    }
    .diff-badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .diff-1 { background: #c6f6d5; color: #276749; }
    .diff-2 { background: #bee3f8; color: #2b6cb0; }
    .diff-3 { background: #fefcbf; color: #975a16; }
    .diff-4 { background: #fed7d7; color: #c53030; }
    .diff-5 { background: #e53e3e; color: #fff; }
</style>
{% endblock %}

{% block content %}
<a href="/parent" style="color: #667eea; text-decoration: none; font-size: 14px;">&larr; Back to Dashboard</a>
<h1 style="margin-top: 10px;">Create Math Bank Test — {{ child.name }}</h1>

<div style="margin-bottom: 12px;">
    <label style="font-weight: 600;">Test Title</label>
    <input type="text" id="test-title" placeholder="e.g., Fractions & Geometry Review" style="margin-bottom: 8px;">
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px;">
    <div>
        <label style="font-weight: 600; font-size: 13px;">Timer Mode</label>
        <select id="timer-mode" style="width:100%; padding:8px; font-size:14px; border:1px solid #ccc; border-radius:8px;" onchange="document.getElementById('time-limit-wrap').style.display = this.value === 'countdown' ? '' : 'none'">
            <option value="none">No Timer</option>
            <option value="stopwatch">Stopwatch</option>
            <option value="countdown">Countdown</option>
        </select>
    </div>
    <div id="time-limit-wrap" style="display:none;">
        <label style="font-weight: 600; font-size: 13px;">Time Limit (minutes)</label>
        <input type="number" id="time-limit" min="1" max="120" value="30" style="padding:8px; font-size:14px;">
    </div>
</div>

<!-- Filters -->
<div style="margin-bottom: 8px;">
    <label style="font-size: 13px; font-weight: 600;">Concept:</label>
    <span id="concept-filters"></span>
</div>
<div style="margin-bottom: 8px;">
    <label style="font-size: 13px; font-weight: 600;">Difficulty:</label>
    <button class="filter-btn active" onclick="setDiffFilter(0)">All</button>
    <button class="filter-btn" onclick="setDiffFilter(1)">1</button>
    <button class="filter-btn" onclick="setDiffFilter(2)">2</button>
    <button class="filter-btn" onclick="setDiffFilter(3)">3</button>
    <button class="filter-btn" onclick="setDiffFilter(4)">4</button>
    <button class="filter-btn" onclick="setDiffFilter(5)">5</button>
</div>
<div style="margin-bottom: 12px;">
    <label style="font-size: 13px; font-weight: 600;">Mastery:</label>
    <span id="mastery-filters"></span>
</div>

<div style="display: flex; gap: 8px; margin-bottom: 12px; align-items: center;">
    <button class="btn btn-primary" style="padding:4px 10px; font-size:12px;" onclick="selectAll()">Select All</button>
    <button class="btn btn-warning" style="padding:4px 10px; font-size:12px;" onclick="deselectAll()">Deselect All</button>
    <span style="font-size: 13px; color: #666;"><span id="selected-count">0</span> selected</span>
</div>

<div id="question-list" style="max-height: 500px; overflow-y: auto;">Loading...</div>
<div id="pagination" style="text-align: center; margin-top: 8px;"></div>

<div style="margin-top: 16px;">
    <button class="btn btn-success" style="padding: 12px 30px; font-size: 16px;" onclick="createTest()" id="create-btn" disabled>Create Test</button>
    <span id="create-status" style="margin-left: 10px; font-size: 14px;"></span>
</div>
{% endblock %}

{% block scripts %}
<script>
const childId = {{ child.id }};
let allQuestions = [];
let selectedIds = new Set();
let currentConcept = '';
let currentDiff = 0;
let currentMastery = '';
const MASTERY_LABELS = { never: 'New', wrong: 'Needs Work', due: 'Due', good: 'Good', mastered: 'Mastered' };
const DIFF_COLORS = { 1: 'diff-1', 2: 'diff-2', 3: 'diff-3', 4: 'diff-4', 5: 'diff-5' };

function escHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

async function loadQuestions() {
    let url = `/api/children/${childId}/math-questions?page=1&per_page=200`;
    if (currentConcept) url += `&concept=${encodeURIComponent(currentConcept)}`;
    if (currentDiff) url += `&difficulty=${currentDiff}`;
    if (currentMastery) url += `&status=${currentMastery}`;

    const res = await fetch(url);
    if (!res.ok) return;
    const data = await res.json();
    allQuestions = data.questions || [];

    renderConceptFilters(data.concepts || []);
    renderMasteryFilters(data.status_counts || {});
    renderQuestions(allQuestions);
}

function renderConceptFilters(concepts) {
    const el = document.getElementById('concept-filters');
    let html = `<button class="filter-btn ${currentConcept === '' ? 'active' : ''}" onclick="setConceptFilter('')">All</button>`;
    concepts.forEach(c => {
        html += `<button class="filter-btn ${currentConcept === c ? 'active' : ''}" onclick="setConceptFilter('${escHtml(c)}')">${escHtml(c)}</button>`;
    });
    el.innerHTML = html;
}

function renderMasteryFilters(counts) {
    const el = document.getElementById('mastery-filters');
    const total = Object.values(counts).reduce((a, b) => a + b, 0);
    let html = `<button class="filter-btn ${currentMastery === '' ? 'active' : ''}" onclick="setMasteryFilter('')">All (${total})</button>`;
    for (const [key, label] of Object.entries(MASTERY_LABELS)) {
        const count = counts[key] || 0;
        if (count > 0) html += `<button class="filter-btn ${currentMastery === key ? 'active' : ''}" onclick="setMasteryFilter('${key}')">${label} (${count})</button>`;
    }
    el.innerHTML = html;
}

function setConceptFilter(c) { currentConcept = c; loadQuestions(); }
function setDiffFilter(d) {
    currentDiff = d;
    document.querySelectorAll('[onclick^="setDiffFilter"]').forEach((btn, i) => btn.classList.toggle('active', i === d));
    loadQuestions();
}
function setMasteryFilter(m) { currentMastery = m; loadQuestions(); }

function renderQuestions(questions) {
    const list = document.getElementById('question-list');
    if (questions.length === 0) {
        list.innerHTML = '<p style="color:#999;">No questions match filters. Add questions to the bank first.</p>';
        return;
    }
    list.innerHTML = questions.map(q => {
        const sel = selectedIds.has(q.id);
        const concepts = (q.concepts || []).map(c => `<span class="concept-tag">${escHtml(c)}</span>`).join(' ');
        const diffCls = DIFF_COLORS[q.difficulty] || 'diff-3';
        return `<div class="q-item ${sel ? 'selected' : ''}" onclick="toggleQ(${q.id})">
            <input type="checkbox" ${sel ? 'checked' : ''} style="pointer-events:none;">
            <div style="flex:1; min-width:0;">
                <div style="font-size:14px; color:#333; line-height:1.4;">${escHtml(q.question_text)}</div>
                <div style="font-size:11px; margin-top:4px;">
                    ${concepts}
                    <span class="diff-badge ${diffCls}">Diff ${q.difficulty}</span>
                </div>
            </div>
        </div>`;
    }).join('');
}

function toggleQ(id) {
    if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
    updateCount();
    const items = document.querySelectorAll('.q-item');
    items.forEach(el => {
        const cb = el.querySelector('input[type="checkbox"]');
        if (el.getAttribute('onclick') === `toggleQ(${id})`) {
            el.classList.toggle('selected', selectedIds.has(id));
            cb.checked = selectedIds.has(id);
        }
    });
}

function selectAll() {
    allQuestions.forEach(q => selectedIds.add(q.id));
    renderQuestions(allQuestions);
    updateCount();
}

function deselectAll() {
    allQuestions.forEach(q => selectedIds.delete(q.id));
    renderQuestions(allQuestions);
    updateCount();
}

function updateCount() {
    document.getElementById('selected-count').textContent = selectedIds.size;
    document.getElementById('create-btn').disabled = selectedIds.size === 0;
}

async function createTest() {
    const title = document.getElementById('test-title').value.trim();
    if (!title) { alert('Please enter a test title'); return; }
    if (selectedIds.size === 0) { alert('Please select at least one question'); return; }

    const timerMode = document.getElementById('timer-mode').value;
    const timeLimitMinutes = parseInt(document.getElementById('time-limit').value) || 0;

    const btn = document.getElementById('create-btn');
    const statusEl = document.getElementById('create-status');
    btn.disabled = true;
    statusEl.textContent = 'Creating...';

    const res = await fetch('/api/math-bank-tests', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            child_id: childId,
            title,
            question_ids: [...selectedIds],
            timer_mode: timerMode,
            time_limit_seconds: timerMode === 'countdown' ? timeLimitMinutes * 60 : 0
        })
    });

    if (res.ok) {
        const data = await res.json();
        window.location.href = '/parent';
    } else {
        const data = await res.json();
        statusEl.textContent = data.error || 'Failed';
        statusEl.style.color = '#e53e3e';
        btn.disabled = false;
    }
}

loadQuestions();
</script>
{% endblock %}
