{% extends "base.html" %}

{% block title %}Create Test - {{ child.name }}{% endblock %}

{% block extra_css %}
<style>
    .word-select-item {
        display: flex;
        align-items: center;
        padding: 12px 15px;
        border: 2px solid #e2e8f0;
        border-radius: 10px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: all 0.2s;
        user-select: none;
    }
    .word-select-item:hover { border-color: #667eea; background: #f7fafc; }
    .word-select-item.selected { border-color: #667eea; background: #ebf4ff; }
    .select-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        flex-wrap: wrap;
        gap: 8px;
    }
    .floating-btn {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        max-width: 600px;
        width: calc(100% - 60px);
        font-size: 18px;
        padding: 18px;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .floating-btn:hover {
        transform: translateX(-50%);
    }
</style>
{% endblock %}

{% block content %}
<a href="/" style="color: #667eea; text-decoration: none;">&larr; Back</a>
<h1 style="margin-top: 10px;">Create Test for {{ child.name }}</h1>

<div style="margin-bottom: 20px;">
    <label style="font-weight: bold;">Test Title (optional)</label>
    <input type="text" id="test-title" placeholder="e.g. Week 5 Vocabulary Test...">
</div>

<div class="select-bar">
    <div>
        <button class="btn btn-primary" style="padding: 8px 15px; font-size: 14px;" onclick="selectAll()">Select All</button>
        <button class="btn btn-warning" style="padding: 8px 15px; font-size: 14px;" onclick="deselectAll()">Deselect All</button>
    </div>
    <div style="color: #666;"><span id="selected-count">0</span> words selected</div>
</div>

<div id="word-checklist" style="padding-bottom: 80px;">
    Loading words...
</div>

<button id="create-btn" class="btn btn-success floating-btn" onclick="createTest()" disabled>
    Create Test (select at least 4 words)
</button>
{% endblock %}

{% block scripts %}
<script>
const childId = {{ child.id }};
let allWords = [];
let selectedIds = new Set();

async function loadWords() {
    const res = await fetch(`/api/children/${childId}/words`);
    allWords = await res.json();
    renderChecklist();
}

function renderChecklist() {
    const container = document.getElementById('word-checklist');
    const wordsWithDef = allWords.filter(w => w.definition);

    if (wordsWithDef.length === 0) {
        container.innerHTML = '<p style="color: #666;">No words with definitions found.</p>';
        return;
    }

    container.innerHTML = wordsWithDef.map(w => `
        <div class="word-select-item" id="ws-${w.id}" onclick="toggleWord(${w.id})">
            <div style="flex: 1;">
                <strong style="font-size: 18px;">${escapeHtml(w.word)}</strong>
                <div style="font-size: 14px; color: #888; margin-top: 2px;">${escapeHtml(w.definition || '')}</div>
            </div>
        </div>
    `).join('');
}

function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function toggleWord(wordId) {
    if (selectedIds.has(wordId)) {
        selectedIds.delete(wordId);
    } else {
        selectedIds.add(wordId);
    }
    document.getElementById(`ws-${wordId}`).classList.toggle('selected', selectedIds.has(wordId));
    updateCount();
}

function updateCount() {
    const count = selectedIds.size;
    document.getElementById('selected-count').textContent = count;
    const btn = document.getElementById('create-btn');
    btn.disabled = count < 4;
    btn.textContent = count < 4
        ? `Create Test (select at least ${4 - count} more)`
        : `Create Test (${count} words)`;
}

function selectAll() {
    allWords.filter(w => w.definition).forEach(w => selectedIds.add(w.id));
    document.querySelectorAll('.word-select-item').forEach(el => el.classList.add('selected'));
    updateCount();
}

function deselectAll() {
    selectedIds.clear();
    document.querySelectorAll('.word-select-item').forEach(el => el.classList.remove('selected'));
    updateCount();
}

async function createTest() {
    const wordIds = [...selectedIds];
    const title = document.getElementById('test-title').value.trim() || new Date().toLocaleDateString();

    const res = await fetch('/api/parent-tests', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ child_id: childId, word_ids: wordIds, title })
    });

    if (res.ok) {
        alert('Test created! The child will see it when they log in.');
        window.location.href = '/parent';
    } else {
        const data = await res.json();
        alert('Error: ' + (data.error || 'Failed to create test'));
    }
}

loadWords();
</script>
{% endblock %}
