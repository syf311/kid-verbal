<style>
    .qb-svg svg { width: 100%; height: 100%; color: #2d3748; }
    /* stem_svg may hold one figure or a row of figures */
    .qb-stem-svg { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
    .qb-stem-svg svg { width: 64px; height: 64px; flex: none; }
    .qb-stem-svg.one-fig { justify-content: center; }
    .qb-stem-svg.one-fig svg { width: 200px; height: auto; max-height: 180px; }
    .qb-opt-svg { width: 64px; height: 64px; display: inline-block; vertical-align: middle; }
    /* SVG embedded in rich text. CSS width overrides any width attr, so sizes are always capped. */
    .qb-rich svg { max-width: 100%; height: auto; color: #2d3748; vertical-align: middle; }
    .qb-stem.qb-rich svg { width: 64px; max-height: 64px; margin: 4px; }           /* a row of figures */
    .qb-stem.qb-rich.one-fig svg { width: 200px; max-height: 180px; display: block; margin: 8px auto; }  /* single figure */
    .qb-opt-text.qb-rich svg { width: 64px; max-height: 64px; display: block; margin: 0 auto; }
    .qb-img { max-width: 100%; max-height: 240px; border-radius: 10px; margin: 10px 0; display: block; }
    .qb-passage { background: #fffaf0; border: 2px solid #fbd38d; border-radius: 14px; padding: 16px 18px; margin-bottom: 16px;
                  font-size: 17px; line-height: 1.7; color: #2d3748; white-space: pre-wrap; max-height: 360px; overflow-y: auto; }
    .qb-passage h4 { margin: 0 0 8px; color: #c05621; }
</style>
<script>
// Shared renderers for CogAT-style / i-Ready-style questions.
// stem / option text / explanation / passage body arrive as server-sanitized HTML (allow-listed tags only).
const QB_LETTERS = 'ABCDEF';
function qbEsc(str) {
    if (str === null || str === undefined) return '';
    const div = document.createElement('div');
    div.textContent = String(str);
    return div.innerHTML;
}
function qbRich(html) {
    if (!html) return '';
    // Plain text keeps its line breaks; markup is rendered as-is
    return /<[a-z]/i.test(html) ? html : html.replace(/\n/g, '<br>');
}
function qbHasSvg(opt) { return !!(opt.svg || /<svg/i.test(opt.text || '')); }
function qbStemHtml(q) {
    let html = '';
    if (q.stem) {
        const figs = (q.stem.match(/<svg/gi) || []).length;
        html += `<div class="qb-stem qb-rich${figs === 1 ? ' one-fig' : ''}">${qbRich(q.stem)}</div>`;
    }
    if (q.stem_svg) {
        const figs = (q.stem_svg.match(/<svg/gi) || []).length;
        html += `<div class="qb-svg qb-stem-svg${figs === 1 ? ' one-fig' : ''}">${q.stem_svg}</div>`;
    }
    if (q.image_path) html += `<img class="qb-img" src="/uploads/${encodeURIComponent(q.image_path)}" alt="Question image">`;
    return html;
}
function qbOptionHtml(opt) {
    let html = '';
    if (opt.svg) html += `<span class="qb-svg qb-opt-svg">${opt.svg}</span>`;
    if (opt.text) html += `<span class="qb-opt-text qb-rich">${qbRich(opt.text)}</span>`;
    return html;
}
function qbPassageHtml(p) {
    if (!p) return '';
    return `<div class="qb-passage">${p.title ? `<h4>${qbEsc(p.title)}</h4>` : ''}<div class="qb-rich">${p.body || ''}</div></div>`;
}
</script>
