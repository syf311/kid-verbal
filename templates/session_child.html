{% extends "base.html" %}

{% block title %}Reading Session - Child{% endblock %}

{% block extra_css %}
<style>
    .reading-content {
        font-size: 24px;
        line-height: 2;
        white-space: pre-wrap;
    }
    .reading-content span.highlighted {
        background: #faf089;
        font-weight: bold;
        padding: 2px 5px;
        border-radius: 5px;
    }
    .question-modal {
        display: none;
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 380px;
        background: rgba(0,0,0,0.3);
        z-index: 100;
    }
    .question-box {
        background: white;
        height: 100%;
        padding: 25px;
        box-shadow: -5px 0 20px rgba(0,0,0,0.2);
        display: flex;
        flex-direction: column;
    }
    .question-display {
        font-size: 18px;
        line-height: 1.6;
        margin-bottom: 15px;
        padding: 15px;
        background: #f7fafc;
        border-radius: 12px;
        border-left: 4px solid #667eea;
        overflow-y: auto;
        flex: 1;
        white-space: pre-line;
    }
    .question-display img {
        max-width: 100%;
        max-height: 300px;
        border-radius: 8px;
        margin: 4px 0;
    }
    .answer-input {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        box-sizing: border-box;
        min-height: 60px;
        resize: vertical;
    }
    .answer-input:focus {
        outline: none;
        border-color: #667eea;
    }
</style>
{% endblock %}

{% block content %}
<div style="margin-bottom: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>{{ material.title }}</h1>
        <button class="btn btn-danger" style="padding: 8px 20px;" onclick="leaveSession()">Leave Session</button>
    </div>
    <div style="background: #e2e8f0; padding: 10px; border-radius: 8px;">
        <span id="connection-status" style="color: #666;">Connecting to parent...</span>
    </div>
</div>

<div style="margin-bottom: 20px;">
    <label>Who's reading? </label>
    <select id="child-select" style="padding: 10px; font-size: 18px;">
        {% for child in children %}
        <option value="{{ child.id }}">{{ child.name }}</option>
        {% endfor %}
    </select>
</div>

<div class="reading-content" id="content">
    <!-- Words will be wrapped in spans -->
</div>

<div class="question-modal" id="question-modal">
    <div class="question-box">
        <h2 style="margin-top: 0;">Question</h2>
        <div class="question-display" id="question-text"></div>
        <textarea class="answer-input" id="answer-input" placeholder="Type your answer here..."></textarea>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="btn btn-success" style="flex: 1; font-size: 18px; padding: 15px;" onclick="submitAnswer()">
                Submit Answer
            </button>
            <button class="btn" style="background: #e2e8f0; padding: 15px;" onclick="closeQuestion()">
                Skip
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
<script>
const materialId = {{ material.id }};
const socket = io();
let currentQuestion = null;

// Wrap each word in a span, preserving newlines
const content = `{{ material.content | e }}`;
const contentEl = document.getElementById('content');
contentEl.innerHTML = content.split(/(\s+)/).map((part, i) => {
    if (part.trim()) {
        return `<span data-index="${i}">${part}</span>`;
    }
    return part;
}).join('');

socket.emit('join_session', { material_id: materialId, role: 'child' });

socket.on('connect', () => {
    document.getElementById('connection-status').textContent = 'Connected to parent!';
    document.getElementById('connection-status').style.color = '#48bb78';
});

socket.on('word_highlighted', (data) => {
    // Clear previous highlights
    document.querySelectorAll('.highlighted').forEach(e => e.classList.remove('highlighted'));

    // Highlight the word
    const spans = contentEl.querySelectorAll('span');
    if (data.index !== undefined && spans[data.index]) {
        spans[data.index].classList.add('highlighted');
        spans[data.index].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
});

socket.on('highlight_cleared', () => {
    document.querySelectorAll('.highlighted').forEach(e => e.classList.remove('highlighted'));
});

socket.on('question_asked', (data) => {
    currentQuestion = data;
    const questionEl = document.getElementById('question-text');
    // Use HTML content if available, otherwise plain text
    if (data.question_html) {
        questionEl.innerHTML = data.question_html;
    } else {
        questionEl.textContent = data.question;
    }
    document.getElementById('answer-input').value = '';
    document.getElementById('question-modal').style.display = 'block';
    document.getElementById('answer-input').focus();
});

socket.on('word_added', (data) => {
    // Show brief notification
    const el = document.createElement('div');
    el.style.cssText = 'position: fixed; top: 20px; right: 20px; background: #48bb78; color: white; padding: 15px 25px; border-radius: 10px; z-index: 200; font-size: 16px;';
    el.textContent = `"${data.word}" added to your words!`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
});

function submitAnswer() {
    const answer = document.getElementById('answer-input').value.trim();
    if (!answer) {
        document.getElementById('answer-input').focus();
        return;
    }
    socket.emit('child_response', {
        material_id: materialId,
        response: answer,
        question: currentQuestion?.question,
        word: currentQuestion?.word
    });
    closeQuestion();
}

function closeQuestion() {
    document.getElementById('question-modal').style.display = 'none';
    currentQuestion = null;
}

function leaveSession() {
    socket.disconnect();
    window.location.href = '/';
}

// Allow Enter key to submit (Shift+Enter for newline)
document.getElementById('answer-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitAnswer();
    }
});

// Track scroll position
let lastScroll = 0;
window.addEventListener('scroll', () => {
    const now = Date.now();
    if (now - lastScroll < 500) return;
    lastScroll = now;

    const percent = Math.round((window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100);
    socket.emit('scroll_update', { material_id: materialId, percent: percent });
});
</script>
{% endblock %}
