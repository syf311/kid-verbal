{% extends "base.html" %}

{% block title %}{{ plan.title }} - {{ child.name }}{% endblock %}

{% block extra_css %}
<style>
    .progress-bar-wrap {
        background: #e2e8f0;
        border-radius: 10px;
        height: 20px;
        overflow: hidden;
        margin-bottom: 20px;
    }
    .progress-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #667eea, #48bb78);
        border-radius: 10px;
        transition: width 0.5s ease;
    }
    .progress-text {
        font-size: 14px;
        color: #666;
        margin-bottom: 8px;
        text-align: center;
    }
    .item-card {
        background: #f7fafc;
        border-radius: 12px;
        padding: 16px 20px;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .item-card .icon {
        font-size: 28px;
        margin-right: 14px;
        flex-shrink: 0;
    }
    .item-card .info { flex: 1; }
    .item-card .info strong { font-size: 16px; display: block; }
    .item-card .info .meta { font-size: 13px; color: #888; margin-top: 2px; }
    .item-card .action { flex-shrink: 0; margin-left: 10px; }
    .item-card .action .btn { padding: 10px 22px; font-size: 15px; }
    .type-label {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 4px;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .type-vocabulary { background: #ebf4ff; color: #667eea; }
    .type-reading { background: #fefcbf; color: #975a16; }
    .type-math { background: #fed7d7; color: #c53030; }
    .type-test { background: #e9d8fd; color: #6b46c1; }
    .type-writing { background: #c6f6d5; color: #276749; }
    .badge-done {
        display: inline-block;
        background: #c6f6d5;
        color: #276749;
        font-size: 12px;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 6px;
    }
    .badge-pending {
        display: inline-block;
        background: #fefcbf;
        color: #975a16;
        font-size: 12px;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 6px;
    }
    .celebration {
        text-align: center;
        padding: 30px 20px;
        background: linear-gradient(135deg, #f0fff4, #ebf8ff);
        border-radius: 16px;
        margin-bottom: 20px;
    }
    .celebration .big-icon { font-size: 64px; }
    .celebration h2 { color: #276749; margin-top: 10px; }
    .celebration p { color: #555; font-size: 16px; }
    .badge-reviewed {
        display: inline-block;
        background: #bee3f8;
        color: #2b6cb0;
        font-size: 12px;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 6px;
    }
    .review-check {
        width: 22px;
        height: 22px;
        cursor: pointer;
        accent-color: #667eea;
        flex-shrink: 0;
        margin-left: 10px;
    }
    .review-all-bar {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 12px;
        gap: 10px;
    }
    .review-all-bar .btn { padding: 8px 18px; font-size: 14px; }
    .item-card.reviewed-card {
        background: #ebf8ff;
        border: 1px solid #bee3f8;
    }
</style>
{% endblock %}

{% block content %}
<a href="{{ '/parent#child-' ~ child.id if role == 'parent' else '/child/' ~ child.id }}" style="color: #667eea; text-decoration: none; font-size: 14px;">&larr; Back to Dashboard</a>
<h1 style="margin-top: 10px;">{{ plan.title }}</h1>

<div id="plan-content">
    <div class="progress-text">Loading...</div>
</div>
{% endblock %}

{% block scripts %}
<script>
const childId = {{ child.id }};
const planId = {{ plan.id }};
const isParent = {{ 'true' if role == 'parent' else 'false' }};

function escHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

async function loadPlan() {
    const res = await fetch(`/api/learning-plans/${planId}`);
    if (!res.ok) return;
    const data = await res.json();
    render(data);
}

function render(data) {
    const items = data.items || [];
    const total = items.length;
    const done = items.filter(i => i.details && i.details.status === 'completed').length;
    const pct = total > 0 ? Math.round(done / total * 100) : 0;
    const allDone = done === total && total > 0;
    const planStatus = data.status || '';
    const allReviewed = planStatus === 'reviewed';
    const reviewedCount = items.filter(i => i.parent_reviewed).length;

    let html = '';

    // Celebration
    if (allReviewed) {
        html += `<div class="celebration" style="background: linear-gradient(135deg, #ebf8ff, #e9d8fd);">
            <div class="big-icon">&#x2705;</div>
            <h2>Fully Reviewed</h2>
            <p>All items have been reviewed by parent.</p>
        </div>`;
    } else if (allDone) {
        html += `<div class="celebration">
            <div class="big-icon">&#x1F389;</div>
            <h2>All Done!</h2>
            <p>You completed everything in this plan. Great job!</p>
        </div>`;
    }

    // Progress bar
    html += `<div class="progress-text">${done} of ${total} items complete (${pct}%)</div>`;
    html += `<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width: ${pct}%"></div></div>`;

    // Review All bar (parent only, when plan is completed or reviewed)
    if (isParent && allDone) {
        html += `<div class="review-all-bar">`;
        html += `<span style="font-size:13px; color:#666; line-height:36px;">${reviewedCount} of ${total} reviewed</span>`;
        if (!allReviewed) {
            html += `<button class="btn btn-primary" onclick="reviewAll()">Review All</button>`;
        }
        html += `</div>`;
    }

    // Items
    items.forEach(item => {
        const d = item.details || {};
        const status = d.status || 'pending';
        const completed = status === 'completed';
        const reviewed = item.parent_reviewed;
        let icon = '';
        let typeLabel = '';
        let typeCls = '';
        let title = d.title || 'Item';
        let meta = '';
        let href = '#';

        if (item.item_type === 'study_session') {
            icon = '&#x1F4D6;';
            typeLabel = 'Vocabulary';
            typeCls = 'type-vocabulary';
            meta = `${d.word_count || 0} words`;
            href = `/child/${childId}/study/${item.item_id}`;
        } else if (item.item_type === 'reading_assignment') {
            icon = '&#x1F4DA;';
            typeLabel = 'Reading';
            typeCls = 'type-reading';
            meta = `${d.question_count || 0} questions`;
            if (completed && d.correct_count != null) {
                meta += ` &middot; ${d.correct_count}/${d.question_count} correct`;
            }
            href = completed
                ? `/child/${childId}/reading-assignment/${item.item_id}/review`
                : `/child/${childId}/reading-assignment/${item.item_id}`;
        } else if (item.item_type === 'math_test') {
            icon = '&#x1F4DD;';
            typeLabel = 'Math';
            typeCls = 'type-math';
            meta = `${d.total_questions || 0} questions`;
            if (completed && d.score != null) {
                meta += ` &middot; ${d.correct_count}/${d.total_count} correct (${d.score}%)`;
            }
            href = completed
                ? `/child/${childId}/math-test/${item.item_id}/review`
                : `/child/${childId}/math-test/${item.item_id}`;
        } else if (item.item_type === 'parent_test') {
            icon = '&#x270F;';
            typeLabel = 'Test';
            typeCls = 'type-test';
            meta = `${d.word_count || 0} words`;
            if (completed && d.correct_count != null && d.total_count != null) {
                const pct = d.total_count > 0 ? Math.round(d.correct_count * 100 / d.total_count) : 0;
                meta += ` &middot; ${d.correct_count}/${d.total_count} correct (${pct}%)`;
            }
            href = completed
                ? `/child/${childId}/tests/${d.test_session_id || ''}?plan_id=${planId}`
                : `/child/${childId}/test/${item.item_id}`;
        } else if (item.item_type === 'writing_test') {
            icon = '&#x270D;';
            typeLabel = status === 'revision' ? 'Writing (Revision)' : 'Writing';
            typeCls = 'type-writing';
            meta = '';
            if (status === 'revision') {
                meta = 'Sent back for revision';
            } else if (completed && d.word_count != null) {
                meta = `${d.word_count} words`;
                if (d.score != null) meta += ` &middot; Score: ${d.score}/100`;
            }
            href = completed
                ? `/child/${childId}/writing-test/${item.item_id}/review`
                : `/child/${childId}/writing-test/${item.item_id}`;
        } else if (item.item_type === 'science_study') {
            icon = '&#x1F52C;';
            typeLabel = 'Science Study';
            typeCls = 'type-vocabulary';
            meta = `${d.question_count || 0} questions`;
            href = `/child/${childId}/science-study/${item.item_id}`;
        } else if (item.item_type === 'science_test') {
            icon = '&#x1F9EA;';
            typeLabel = 'Science Test';
            typeCls = 'type-math';
            meta = `${d.question_count || 0} questions`;
            if (completed && d.score != null) {
                meta += ` &middot; ${d.correct_count}/${d.total_count} correct (${d.score}%)`;
            }
            href = completed
                ? `/child/${childId}/science-test/${item.item_id}/review`
                : `/child/${childId}/science-test/${item.item_id}`;
        }

        const statusBadge = reviewed
            ? '<span class="badge-reviewed">Reviewed</span>'
            : completed
                ? '<span class="badge-done">Done</span>'
                : '<span class="badge-pending">Not Started</span>';
        const btnLabel = completed ? 'Review' : 'Start';
        const btnClass = completed ? 'btn-primary' : 'btn-success';
        const cardCls = reviewed ? 'item-card reviewed-card' : 'item-card';

        html += `<div class="${cardCls}">
            <span class="icon">${icon}</span>
            <div class="info">
                <span class="type-label ${typeCls}">${typeLabel}</span>
                <strong>${escHtml(title)}</strong>
                <div class="meta">${meta} ${statusBadge}</div>
            </div>
            <div class="action" style="display:flex; align-items:center; gap:6px;">
                <a href="${href}" class="btn ${btnClass}">${btnLabel}</a>`;

        // Review checkbox for parent on completed items
        if (isParent && completed) {
            html += `<input type="checkbox" class="review-check" title="Mark as reviewed"
                ${reviewed ? 'checked' : ''}
                onchange="toggleReview(${item.id}, this)">`;
        }

        html += `</div>
        </div>`;
    });

    document.getElementById('plan-content').innerHTML = html;
}

async function toggleReview(itemId, checkbox) {
    const res = await fetch(`/api/learning-plans/${planId}/items/${itemId}/review`, { method: 'POST' });
    if (!res.ok) {
        checkbox.checked = !checkbox.checked;
        return;
    }
    loadPlan();
}

async function reviewAll() {
    if (!confirm('Mark all items as reviewed?')) return;
    const res = await fetch(`/api/learning-plans/${planId}/items/review-all`, { method: 'POST' });
    if (res.ok) loadPlan();
}

loadPlan();
</script>
{% endblock %}
